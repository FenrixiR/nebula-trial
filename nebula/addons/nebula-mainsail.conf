
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nebula_moonraker {
    server 127.0.0.1:7125;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 100.64.0.0/10;
    allow 169.254.0.0/16;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow ::1;
    allow fc00::/7;
    allow fe80::/10;
    deny all;

    root /var/www/mainsail;
    index index.html;
    client_max_body_size 100m;          # G-code uploads; nginx spools them to disk, not to memory

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
    }

    location /websocket {
        proxy_pass http://nebula_moonraker/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://nebula_moonraker$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600;
    }

    include /etc/nginx/nebula-cameras/*.conf;       # one file per camera, written by the camera list
}

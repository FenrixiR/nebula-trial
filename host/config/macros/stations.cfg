
[gcode_macro _STATIONS]
variable_stations: {'chute': {'x': 202, 'y': 264, 'approach_y': 250}, 'strip': {'x': 193, 'y': 264, 'approach_y': 250}, 'brush': {'x': 187, 'y': 264, 'approach_y': 250}}
variable_patterns: {'brush_wipe': [[0, 0], [-2, -2], [-4, 0], [-6, -2], [-8, 0], [-10, -2], [-12, 0], [-14, -2], [0, -2]], 'strip_swipe': [[-7, 0], [0, 0], [-7, 0]]}
variable_tolerance: 0.5          # "already at the station" if within this of x and y
variable_travel_speed: 12000     # mm/min, fast moves to the approach point
variable_dock_speed: 1200        # mm/min, slow final move into the station
variable_wipe_speed: 9000        # mm/min, stroke speed
variable_wear_slots: 1           # >1 spreads wipes over this many Y offsets so one strip of brush does not wear
variable_wear_step_y: 0.5        #   (offsets go towards smaller Y: the back is at the axis limit)
gcode:

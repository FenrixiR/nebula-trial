


[gcode_macro _GOTO_STATION]
gcode:
    {% set st = printer['gcode_macro _STATIONS'] %}
    {% set s = st.stations[params.NAME] %}
    {% set direct = params.DIRECT|default(0)|int %}
    _CG28 AXIS=XY
    {% set pos = printer.gcode_move.position %}
    {% if "xy" in printer.toolhead.homed_axes and (pos.x - s.x)|abs < st.tolerance and (pos.y - s.y)|abs < st.tolerance %}
        RETURN ; already there
    {% endif %}
    G90
    {% if direct == 1 %}
        G0 X{s.x} Y{s.y} F{st.dock_speed}
    {% else %}
        G0 X{s.x} F{st.travel_speed}
        G0 Y{s.approach_y} F{st.travel_speed}
        G0 Y{s.y} F{st.dock_speed}
    {% endif %}
    M400


[gcode_macro _LEAVE_STATION]
gcode:
    {% set st = printer['gcode_macro _STATIONS'] %}
    {% set s = st.stations[params.NAME] %}
    G90
    G0 Y{s.approach_y} F{st.travel_speed}


[gcode_macro _STATION_PATH]
gcode:
    {% set st = printer['gcode_macro _STATIONS'] %}
    {% set s = st.stations[params.NAME] %}
    {% set pat = st.patterns[params.PATTERN] %}
    {% set passes = params.PASSES|default(1)|int %}
    {% set speed = params.SPEED|default(st.wipe_speed)|int %}
    {% set dy = params.DY|default(0)|float %}
    G90
    G1 F{speed}
    {% for p in range(passes) %}
        {% for pt in pat %}
            G1 X{s.x + pt[0]} Y{s.y + pt[1] + dy}
        {% endfor %}
    {% endfor %}



[gcode_macro MOVE_TO_TRAY]
gcode:
    _GOTO_STATION NAME=chute


[gcode_macro _NOZZLE_RETRACT]
gcode:
    {% set mm = params.MM|default(0)|float %}
    {% if mm > 0 %}
        M83
        G1 E-{mm} F1800
    {% endif %}


[gcode_macro _NOZZLE_FIRM]
gcode:
    {% set seconds = params.SECONDS|default(5)|float %}
    M106 S255
    {% if seconds > 0 %}
        G4 P{(seconds * 1000)|int}
    {% endif %}


[gcode_macro _NOZZLE_STRIP]
gcode:
    _GOTO_STATION NAME=strip DIRECT=1
    _STATION_PATH NAME=strip PATTERN=strip_swipe PASSES=1


[gcode_macro _NOZZLE_WIPE]
variable_wear_slot: 0
gcode:
    {% set st = printer['gcode_macro _STATIONS'] %}
    {% set self = printer['gcode_macro _NOZZLE_WIPE'] %}
    {% set passes = params.PASSES|default(4)|int %}
    {% set dy = -((self.wear_slot % st.wear_slots) * st.wear_step_y) %}
    _GOTO_STATION NAME=brush DIRECT=1
    _STATION_PATH NAME=brush PATTERN=brush_wipe PASSES={passes} DY={dy}
    SET_GCODE_VARIABLE MACRO=_NOZZLE_WIPE VARIABLE=wear_slot VALUE={self.wear_slot + 1}


[gcode_macro NOZZLE_CHECK]
gcode:
    G90
    G1 Z10 F600
    G1 X128 Y128 F6000
    PROBE
    _NOZZLE_CHECK_EVAL {rawparams}


[gcode_macro _NOZZLE_CHECK_EVAL]
gcode:
    G90
    G1 Z10 F600
    {% set t = printer.extruder.temperature|float %}
    {% set pts = [[25, -0.006], [140, 0.098], [210, 0.143]] %}
    {% set ns = namespace(h=pts[-1][1]) %}
    {% if t <= pts[0][0] %}
        {% set ns.h = pts[0][1] %}
    {% else %}
        {% for i in range(pts|length - 1) %}
            {% if t > pts[i][0] and t <= pts[i + 1][0] %}
                {% set ns.h = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * (t - pts[i][0]) / (pts[i + 1][0] - pts[i][0]) %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% set expect = params.EXPECT|default(ns.h)|float %}
    {% set tol = params.TOL|default(0.05)|float %}
    {% set strict = params.STRICT|default(0)|int %}
    {% set h = printer.probe.last_z_result|float %}
    {% if (h - expect)|abs > tol %}
        {% if strict == 1 %}
            {action_raise_error("Nozzle check failed: read %.3f mm, expected %.3f +-%.2f" % (h, expect, tol))}
        {% else %}
            RESPOND TYPE=error MSG="{'Nozzle check: read %.3f mm, expected %.3f +-%.2f, the tip may be dirty' % (h, expect, tol)}"
        {% endif %}
    {% else %}
        RESPOND MSG="{'Nozzle check OK: %.3f mm (expected %.3f, nozzle %.0f C)' % (h, expect, t)}"
    {% endif %}



[save_variables]
filename: ~/printer_data/saved_variables.cfg

[gcode_macro _NOZZLE_GAP]
variable_gap: 0          # mm the filament tip sits behind the nozzle; loaded from disk at start
variable_max_gap: 25
variable_prime_speed: 120    # mm/min (2 mm/s)
gcode:

[delayed_gcode _NOZZLE_GAP_INIT]
initial_duration: 2
gcode:
    {% set sv = printer.save_variables.variables %}
    SET_GCODE_VARIABLE MACRO=_NOZZLE_GAP VARIABLE=gap VALUE={sv.nozzle_gap|default(1)|float}

[gcode_macro _NOZZLE_GAP_SET]
gcode:
    {% set g = printer['gcode_macro _NOZZLE_GAP'] %}
    {% set mm = [[params.MM|default(0)|float, 0]|max, g.max_gap]|min %}
    SET_GCODE_VARIABLE MACRO=_NOZZLE_GAP VARIABLE=gap VALUE={mm}
    SAVE_VARIABLE VARIABLE=nozzle_gap VALUE={mm}

[gcode_macro _NOZZLE_PRIME]
gcode:
    {% set g = printer['gcode_macro _NOZZLE_GAP'] %}
    {% set extra = params.EXTRA|default(0)|float %}
    {% if not printer.extruder.can_extrude %}
        RESPOND TYPE=error MSG="_NOZZLE_PRIME skipped: nozzle too cold, gap stays {g.gap} mm"
    {% else %}
        {% if g.gap + extra > 0 %}
            M83
            G1 E{g.gap + extra} F{g.prime_speed}
            M400
        {% endif %}
        _NOZZLE_GAP_SET MM=0
        RESPOND MSG="{'Nozzle primed %.1f mm' % (g.gap + extra)}"
    {% endif %}



[gcode_macro _NOZZLE_FAN]
variable_saved: {'p1': 0.0, 'p2': 0.0, 'p3': 0.0}
gcode:

[gcode_macro _NOZZLE_FAN_SAVE]
gcode:
    {% set fans = {
        'p1': printer.fan.speed|float,
        'p2': printer['fan_generic aux_fan'].speed|float,
        'p3': printer['fan_generic case_fan'].speed|float
    } %}
    SET_GCODE_VARIABLE MACRO=_NOZZLE_FAN VARIABLE=saved VALUE="{fans}"

[gcode_macro _NOZZLE_FAN_RESTORE]
gcode:
    {% set fans = printer['gcode_macro _NOZZLE_FAN'].saved %}
    M106 P1 S{(fans.p1|float * 255)|int}
    M106 P2 S{(fans.p2|float * 255)|int}
    M106 P3 S{(fans.p3|float * 255)|int}



[gcode_macro CLEAN_NOZZLE]
description: Clean the nozzle: fan, retract, firm up, wipe, restore (v3)
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set pre_target = printer.extruder.target|int %}
    {% set target = params.TARGET|default(global.extruder_temp.cleaning if pre_target < global.extruder_temp.cleaning else pre_target)|int %}
    {% set retract = params.RETRACT|default(16)|float %}
    {% set firm = params.FIRM|default(5)|float %}
    {% set strip = params.STRIP|default(0)|int %}
    {% set passes = params.PASSES|default(4)|int %}
    {% set leave_temp = params.LEAVE_TEMP|default(0)|int %}
    {% set check = params.CHECK|default(0)|int %}
    {% set prime = params.PRIME|default(0)|int %}
    {% set can_retract = target >= printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% set gap = printer['gcode_macro _NOZZLE_GAP'].gap|float %}
    {% set delta = [retract - gap, 0]|max if can_retract else 0 %}
    {% set cool_here = leave_temp > 0 and pre_target < leave_temp and target > leave_temp %}

    _NOZZLE_FAN_SAVE
    M106 S255

    M104 S{target}
    _GOTO_STATION NAME=chute
    M104 S{target}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target - 2}

    {% if delta > 0 %}
        _NOZZLE_RETRACT MM={delta}
        _NOZZLE_GAP_SET MM={gap + delta}
    {% endif %}
    _NOZZLE_FIRM SECONDS={firm}
    {% if strip == 1 %}
        _NOZZLE_STRIP
    {% endif %}
    _NOZZLE_WIPE PASSES={passes}

    M104 S{pre_target}
    {% if cool_here %}
        _LEAVE_STATION NAME=brush
        _GOTO_STATION NAME=chute
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={leave_temp}
    {% endif %}
    {% if prime == 1 %}
        _LEAVE_STATION NAME=brush
        _GOTO_STATION NAME=chute
        _NOZZLE_PRIME
    {% endif %}
    _LEAVE_STATION NAME=brush
    M400

    _NOZZLE_FAN_RESTORE
    {% if check == 1 %}
        NOZZLE_CHECK
    {% endif %}
    RESPOND MSG="CLEAN_NOZZLE: wiped at {target} C, retracted {delta} mm, gap {0 if prime == 1 else gap + delta} mm"

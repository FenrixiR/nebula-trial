# =====================================================================================
# Centauri Carbon geometry  (hardware facts only, no logic)
# =====================================================================================
#
# README
#   Only the kick strokes remain here. The tray, brush and strip positions moved to
#   macros/stations.cfg (named stations). Everything else that belongs to THIS printer: how far the kick strokes go. The macros in macros/ read these values
#   instead of carrying numbers of their own, so a different printer (or a corrected
#   measurement) means editing this one file and nothing else.
#
#   Read from a macro with:
#       {% set geo = printer['gcode_macro _CENTAURI_GEOMETRY'] %}   ...  {geo.tray_x}
#
#   All values are bed coordinates in mm (absolute, after homing). Speeds are mm/min.
#   The values below are the ones the stock Cosmos macros used, unchanged.
# =====================================================================================

[gcode_macro _CENTAURI_GEOMETRY]
# --- kick (the V-slot that knocks off the filament tail) ---
variable_kick_out_x: 193             # X of the outward swipe (the inward swipe is KICK's end_kick_x)
variable_kick_speed: 8000            # swipe speed
variable_kick_exit_y: 250            # Y to leave towards
variable_kick_exit_speed: 6000       # speed of that exit move
gcode:

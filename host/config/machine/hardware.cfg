# Hardware definition for the Elegoo Centauri Carbon, taken from OpenCentauri Cosmos (klipper-readonly/machine.cfg)
# with the MCU sections moved to mcu.cfg and these host-dependent changes:
#  - [virtual_sdcard] path points at this host
#  - mainboard fan runs at a fixed speed (Cosmos uses the SoC temperature)
#  - [load_cell_probe] moved to ../stage2/ (needs the OpenCentauri hx711s load-cell code)
# Managed file: updates may replace it. Put your own changes in printer.cfg.


[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 9

# kinematics: limited_corexy
# max_x_accel:10000
# max_y_accel:5000
# max_velocity: 500


[gcode_arcs]
resolution: 0.5

[pause_resume]

[exclude_object]

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 1800

[virtual_sdcard]
path: ~/printer_data/gcodes

[danger_options]
# Cosmos uses 0.03 (wired MCUs). Over the Wi-Fi bridge one lost packet costs ~30-40 ms to recover, which
# aborted probes with "Communication timeout during homing". 0.08 survives a lost packet or two.
multi_mcu_trsync_timeout: 0.08

[stepper_x]
step_pin: PE8
dir_pin: !PE7
enable_pin: !PE10
endstop_pin: tmc2209_stepper_x:virtual_endstop
microsteps: 16
full_steps_per_rotation: 200
position_endstop: 256
position_max: 256
position_min: -2
homing_speed: 80
homing_retract_dist: 20
rotation_distance: 39.872
homing_accel:5000

[tmc2209 stepper_x]
tx_pin: PE9
uart_pin: PE6
uart_address: 0
interpolate: true
run_current: 1
home_current: 0.8
sense_resistor: 0.1
coolstep_threshold: 29.904
driver_MULTISTEP_FILT: true
driver_IHOLDDELAY: 12
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 2
driver_HEND: 3
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_FREQ: 2
driver_PWM_GRAD: 15
driver_PWM_OFS: 18
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_SGTHRS: 130
diag_pin: !PG4

[stepper_y]
step_pin: PE14
dir_pin: !PE13
enable_pin: !PE15
endstop_pin: tmc2209_stepper_y:virtual_endstop
microsteps: 16
full_steps_per_rotation: 200
position_endstop: -2
position_max: 265
position_min: -2
homing_speed: 80
homing_retract_dist: 30
rotation_distance: 39.872
homing_accel:5000

[tmc2209 stepper_y]
tx_pin: PE9
uart_pin: PE6
interpolate: true
run_current: 1.0
home_current: 0.8
uart_address: 3
sense_resistor: 0.1
coolstep_threshold: 29.904
driver_MULTISTEP_FILT: true
driver_IHOLDDELAY: 12
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 2
driver_HEND: 3
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_FREQ: 2
driver_PWM_GRAD: 15
driver_PWM_OFS: 18
driver_PWM_REG: 15
driver_PWM_LIM: 4
driver_SEMIN: 2
driver_SEMAX: 4
driver_SEUP: 3
driver_SEDN: 2
driver_SEIMIN: 1
driver_SGTHRS: 130
diag_pin: !PF6

[stepper_z]
step_pin: PG3
dir_pin: !PG2
enable_pin: !PG1
endstop_pin: PG8
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200
position_max: 258
position_min: -4
homing_speed: 8
homing_retract_dist: 10
homing_retract_speed: 6
second_homing_speed: 2

[tmc2209 stepper_z]
tx_pin: PE9
uart_pin: PE6
interpolate: true
run_current: 0.8
uart_address: 1
sense_resistor: 0.1
driver_sgthrs: 130

[extruder]
step_pin: hotend:PC13
dir_pin: hotend:PC14
enable_pin: !hotend:PC15
heater_pin: hotend:PB6
sensor_pin: hotend:PA3
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 52:10
rotation_distance: 28.8 #could be 27.3 needs more testing 28.8 default
nozzle_diameter: 0.4
filament_diameter: 1.75
sensor_type: hotend_thermistor
smooth_time: 1.5
min_temp: 0
max_temp: 335
min_extrude_temp: 180
pressure_advance: 0.04
pressure_advance_smooth_time: 0.04
max_extrude_only_distance: 500 #was 150, for purging
max_extrude_cross_section: 5
control: pid

[tmc2209 extruder]
tx_pin: hotend:PC6
uart_pin: hotend:PC7
interpolate: true
run_current: 0.7
uart_address: 3
sense_resistor: 0.1

[verify_heater extruder]

[thermistor hotend_thermistor]
temperature1: 25
resistance1: 100000
beta: 4300

[heater_fan extruder]
pin: hotend:PC8
tachometer_pin: hotend:PA1
tachometer_poll_interval: 0.001

[fan]
pin: hotend:PB5
tachometer_pin: hotend:PA0


[lis2dw]
spi_speed: 5000000
cs_pin: hotend:PA4
spi_bus: spi1
axes_map: x,z,-y

[input_shaper]
damping_ratio_x: 0.06
damping_ratio_y: 0.082

[resonance_tester]
probe_points: 128,128,20
accel_chip: lis2dw
min_freq: 10
max_freq: 100
accel_per_hz: 100
hz_per_sec: 2


[heater_bed]
heater_pin: PG13
sensor_pin: PB14
sensor_type: Generic 3950
min_temp: 0
max_temp: 125
control: pid
# Cosmos's stock bed PID. Calibrate All does not tune the bed; run PID_CALIBRATE HEATER=heater_bed to replace these.
pid_Kp: 46.504839
pid_Ki: 1.453276
pid_Kd: 372.038710

[verify_heater heater_bed]

[bed_mesh]
speed: 150
horizontal_move_z: 2
mesh_min: 10,10
mesh_max: 246,246
probe_count: 9,9
mesh_pps: 3,3
algorithm: bicubic
adaptive_margin: 3
zero_reference_position: 128, 128
move_check_distance: 3.0
split_delta_z: 0.01
horizontal_z_clearance: 0.4

[filament_switch_sensor filament_sensor]
switch_pin: PC0
pause_on_runout: false
debounce_delay: 1
runout_distance: 770
smart: true
runout_gcode:
  {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
    RESPOND MSG="Refill filament"
    PAUSE STATE=runout
  {% endif %}
immediate_runout_gcode:
  RESPOND MSG="Ran out of filament, using remaining filament in PTFE"
insert_gcode:
  RESPOND MSG="Filament is inserted"

[led case]
white_pin: PG15
initial_WHITE: 1

[led hotend]
white_pin: hotend:PC9

[temperature_sensor chamber]
sensor_pin: PB13
sensor_type: Generic 3950
min_temp: 0
max_temp: 125

[fan_generic aux_fan]
pin: PG17

[fan_generic case_fan]
pin: PG18


[temperature_sensor mcu_toolhead]
sensor_type: temperature_mcu
sensor_mcu: hotend

[temperature_sensor mcu_bed]
sensor_type: temperature_mcu
sensor_mcu: bed


# Cosmos controls this fan from the SoC temperature (temperature_host). On the host that sensor
# would read the wrong machine, so the mainboard fan runs at a fixed speed for now (see the
# delayed_gcode below). TODO: feed the printer SoC temperature across the link.
[fan_generic mainboard]
pin: PG16
tachometer_pin: PG6

[delayed_gcode mainboard_fan_on]
initial_duration: 1
gcode:
  SET_FAN_SPEED FAN=mainboard SPEED=1.0

[screws_tilt_adjust]
screw1: 231, 25
screw1_name: front right screw
screw2: 231, 225
screw2_name: rear right screw
screw3: 31, 225
screw3_name: rear left screw
screw4: 31, 25
screw4_name: front left screw
horizontal_move_z: 5
speed: 300
screw_thread: CCW-M4
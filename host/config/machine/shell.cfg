# Host-side commands. Cosmos runs these on the printer itself (camera, reboot, updater, Doom). Here the host is
# a separate computer, so the names stay defined (macros call them) but do nothing until we give them a real meaning.

[gcode_shell_command CAMERA_LIGHT_ON]
command: true
timeout: 5
verbose: False

[gcode_shell_command CAMERA_LIGHT_OFF]
command: true
timeout: 5
verbose: False

[gcode_shell_command CAMERA_START]
command: true
timeout: 5
verbose: False

[gcode_shell_command CAMERA_STOP]
command: true
timeout: 5
verbose: False

[gcode_shell_command GUI_START]
command: true
timeout: 5
verbose: False

[gcode_shell_command GUI_STOP]
command: true
timeout: 5
verbose: False

[gcode_shell_command REBOOT_SYSTEM]
command: true
timeout: 5
verbose: False

[gcode_shell_command CHECK_FOR_UPDATES]
command: true
timeout: 5
verbose: False

[gcode_shell_command UPDATE_COSMOS]
command: true
timeout: 5
verbose: False

[gcode_shell_command START_DOOM]
command: true
timeout: 5
verbose: False

[gcode_macro REBOOT_MACHINE]
gcode:
    RESPOND MSG="REBOOT_MACHINE is disabled on the Kalico host setup"

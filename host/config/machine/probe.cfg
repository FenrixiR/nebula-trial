# Load cell probe (4x HX711S on the bed MCU). Needs the hx711s plugin from host/pack (installed into klippy/plugins/).

[load_cell_probe]
sensor_type: hx711s
dout_pins: bed:PB14, bed:PC8, bed:PB15, bed:PA8
sclk_pins: bed:PB13, bed:PC7, bed:PC6,  bed:PC9
sensor_orientation: inverted
sample_rate: 80
gain: A-128
speed: 2.0
sample_retract_dist: 0.5
lift_speed: 10.0
counts_per_gram: 105
z_offset: 0.0     # as in stock Cosmos; the Z offset lives in stepper_z position_endstop (calibration)
# reference_tare_counts is set by LOAD_CELL_CALIBRATE ... SAVE=TRUE + SAVE_CONFIG (lives in the auto-save block of printer.cfg)
pullback_distance: 0.4
pullback_speed: 1.0
samples_tolerance: 0.05
samples_tolerance_retries: 3


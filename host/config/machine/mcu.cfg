# MCUs, reached through the relay (centauri-link). The serial paths are pseudo-terminals created by the relay client
# on this host; the printer-side devices are in the relay command line.
# @HOME@ is replaced with the home directory of the host user when the file is installed (Kalico does not expand ~ here).
[mcu]
serial: @HOME@/printer_data/comms/mcu-mainboard
restart_method: command

[mcu bed]
serial: @HOME@/printer_data/comms/mcu-bed
restart_method: command
is_non_critical: true

[mcu hotend]
serial: @HOME@/printer_data/comms/mcu-toolhead
restart_method: command
